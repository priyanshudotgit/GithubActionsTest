name: Docker Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Setup project directory
            if [ ! -d ~/backend-docker ]; then
              git clone https://github.com/priyanshudotgit/GithubActionsTest.git ~/backend-docker
            fi
            cd ~/backend-docker

            # 2. Update code and build
            git pull origin main
            docker build -t backend-app .

            # 3. Refresh container
            docker stop backend-container || true
            docker rm backend-container || true
            docker run -d -p 3000:3000 --name backend-container backend-app
            
            # 4. Storage Maintenance
            docker image prune -f  # Deletes old images to save EC2 disk space